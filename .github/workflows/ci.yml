name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      matrix:
        php: ['8.2','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: php bin/fast-composer --help
  # Everything beyond the unit tests runs through tests/ci.sh, so new checks and contracts
  # reach CI by editing that script, not this workflow.
  checks:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none
          extensions: posix, phar, zip
      - run: composer install --no-interaction --prefer-dist
      - run: bash tests/ci.sh cs analyse contracts
  install-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            composer: '2.6.6'
            prefetch: '0'
          - os: ubuntu-24.04
            composer: '2.8.12'
            prefetch: '1'
          - os: ubuntu-24.04
            composer: '2.9.5'
            prefetch: '1'
          - os: ubuntu-24.04
            composer: '2.10.2'
            prefetch: '1'
          - os: ubuntu-24.04
            composer: '2.10.3'
            prefetch: '1'
          - os: macos-latest
            composer: '2.10.3'
            prefetch: '1'
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && vars.CI_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:${{ matrix.composer }}
          coverage: none
          extensions: posix, phar, zip
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/run.php
      - name: Verify status acceleration (ZIP and Git)
        if: matrix.composer != '2.6.6'
        run: bash tests/ci.sh status status-git
      - name: Verify accelerated install, not just fallback
        env:
          BENCH_INSTALL_PACKAGES: '4'
          BENCH_INSTALL_DELAY: '0.05'
          FAST_COMPOSER_ASSERT_ACCELERATION: ${{ matrix.prefetch }}
        run: bash benchmarks/install.sh
      - name: Verify scoped removal, not just fallback
        env:
          BENCH_NODE_FILES: '1000'
          FAST_COMPOSER_ASSERT_ACCELERATION: '1'
        run: bash benchmarks/removal.sh
