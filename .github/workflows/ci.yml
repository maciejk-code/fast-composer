name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Weekly latest Composer compatibility check (UTC)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: php bin/fast-composer --help
  # Everything beyond the unit tests runs through tests/ci.sh, so new checks and contracts
  # reach CI by editing that script, not this workflow.
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        composer: ['2.10.3', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:${{ matrix.composer }}
      - run: composer install --no-interaction --prefer-dist
      - run: bash tests/ci.sh cs analyse contracts
