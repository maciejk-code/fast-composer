name: Apply single-fetch optimization

on:
  push:
    branches: [optimize-targeted-refresh]
    paths:
      - '.github/workflows/apply-single-fetch-and-readme.yml'
      - '.github/apply-single-fetch-and-readme.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-targeted-refresh
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
      - name: Apply patch
        run: python3 .github/apply-single-fetch-and-readme.py
      - name: Syntax check
        run: php -l src/Snapshot.php
      - name: Run runtime contract
        run: |
          composer install --no-interaction --prefer-dist
          bash tests/runtime-contract.sh
      - name: Remove one-shot patch machinery and generated root lock
        run: |
          rm .github/apply-single-fetch-and-readme.py .github/workflows/apply-single-fetch-and-readme.yml
          rm -f composer.lock
      - name: Commit implementation and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use one fetch for exact dev branches and update benchmarks' || exit 0
          git push origin HEAD:optimize-targeted-refresh
